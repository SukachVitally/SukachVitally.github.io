baseURL = 'https://sukachvitally.github.io/'
languageCode = 'en-us'
title = 'Vitalii Sukach'
theme = 'PaperMod'

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[params]
  author = 'Vitalii Sukach'
  description = 'Articles about Java, PostgreSQL and AI tooling'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = 'Hi, I am Vitalii'
    Content = 'Articles about Java, PostgreSQL and AI tooling.'

  [[params.socialIcons]]
    name = 'medium'
    url = 'https://medium.com/@sukach.v.v'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/SukachVitally'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/vitalii-sukach/'

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']
