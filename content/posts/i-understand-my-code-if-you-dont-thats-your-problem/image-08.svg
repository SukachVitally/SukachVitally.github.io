<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Chalkboard SE','Comic Sans MS','Marker Felt',sans-serif">
  <rect width="1200" height="800" fill="#e9f1f7"/>
  <rect x="0" y="0" width="520" height="800" fill="#3b2a4a"/>
  <text x="260" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#ffd54a">BEFORE</text>
  <text x="860" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a">AFTER</text>

  <!-- monster -->
  <g transform="translate(260 430)">
    <g fill="none" stroke="#7b3fa0" stroke-width="26" stroke-linecap="round">
      <path d="M-120 60 C-200 100, -180 200, -230 240"/>
      <path d="M-60 120 C-80 200, -20 230, -60 300"/>
      <path d="M40 120 C60 200, 0 240, 40 300"/>
      <path d="M120 60 C200 100, 170 210, 220 240"/>
      <path d="M-140 -20 C-230 -40, -220 -140, -240 -180"/>
      <path d="M140 -20 C230 -40, 220 -140, 230 -180"/>
    </g>
    <g font-family="Menlo,monospace" font-size="18" font-weight="700" fill="#fff" stroke="#1a1a1a" stroke-width="4" paint-order="stroke" text-anchor="middle">
      <text x="-230" y="270">if</text>
      <text x="-60" y="330">for</text>
      <text x="40" y="330">&amp;&amp;</text>
      <text x="220" y="270">||</text>
      <text x="-196" y="-194">catch</text>
      <text x="186" y="-194">else if</text>
    </g>
    <path d="M-160 40 C-180 -120, -80 -200, 0 -200 C80 -200, 180 -120, 160 40 C140 140, -140 140, -160 40Z" fill="#9b59b6" stroke="#1a1a1a" stroke-width="6"/>
    <path d="M-80 -90 l50 20 M80 -90 l-50 20" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-55" cy="-50" r="24" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>
    <circle cx="55" cy="-50" r="24" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>
    <circle cx="-50" cy="-46" r="10" fill="#b3261e"/>
    <circle cx="50" cy="-46" r="10" fill="#b3261e"/>
    <path d="M-70 30 Q0 -10 70 30 Q0 80 -70 30Z" fill="#2a0f2e" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M-50 26 l10 18 l10 -20 l10 20 l10 -22 l10 22 l10 -20 l10 18" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-110" y="-290" width="220" height="56" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>
    <text y="-266" text-anchor="middle" font-family="Menlo,monospace" font-size="17" fill="#1a1a1a">placeBet()</text>
    <text y="-243" text-anchor="middle" font-size="17" font-weight="700" fill="#b3261e">CC 13 · 1 test</text>
  </g>

  <!-- arrow -->
  <g transform="translate(520 400)">
    <circle r="56" fill="#ffd54a" stroke="#1a1a1a" stroke-width="5"/>
    <path d="M-28 0 H24 M8 -18 L28 0 L8 18" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="520" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a" stroke="#e9f1f7" stroke-width="6" paint-order="stroke">extract</text>

  <!-- small friendly blobs -->
  <g font-family="Menlo,monospace" text-anchor="middle">
    <g transform="translate(720 220)">
      <path d="M-80 30 C-90 -50, 90 -50, 80 30 C70 70, -70 70, -80 30Z" fill="#7ed3a6" stroke="#1a1a1a" stroke-width="5"/>
      <circle cx="-22" cy="0" r="7" fill="#1a1a1a"/><circle cx="22" cy="0" r="7" fill="#1a1a1a"/>
      <path d="M-16 22 q16 14 32 0" stroke="#1a1a1a" stroke-width="4" fill="none"/>
      <text y="96" font-size="17" fill="#1a1a1a">placeBet</text>
      <text y="120" font-size="16" fill="#2e7d32" font-weight="700">CC 3</text>
    </g>
    <g transform="translate(1000 220)">
      <path d="M-70 30 C-80 -45, 80 -45, 70 30 C60 64, -60 64, -70 30Z" fill="#8ec5ff" stroke="#1a1a1a" stroke-width="5"/>
      <circle cx="-20" cy="0" r="7" fill="#1a1a1a"/><circle cx="20" cy="0" r="7" fill="#1a1a1a"/>
      <path d="M-14 22 q14 12 28 0" stroke="#1a1a1a" stroke-width="4" fill="none"/>
      <text y="96" font-size="17" fill="#1a1a1a">applyFees</text>
      <text y="120" font-size="16" fill="#2e7d32" font-weight="700">CC 3</text>
    </g>
    <g transform="translate(660 520)">
      <path d="M-60 30 C-70 -40, 70 -40, 60 30 C50 60, -50 60, -60 30Z" fill="#ffd27a" stroke="#1a1a1a" stroke-width="5"/>
      <circle cx="-18" cy="2" r="6" fill="#1a1a1a"/><circle cx="18" cy="2" r="6" fill="#1a1a1a"/>
      <path d="M-12 22 q12 10 24 0" stroke="#1a1a1a" stroke-width="4" fill="none"/>
      <text y="90" font-size="16" fill="#1a1a1a">Category.stake</text>
      <text y="114" font-size="16" fill="#2e7d32" font-weight="700">CC 1–2</text>
    </g>
    <g transform="translate(870 540)">
      <path d="M-60 30 C-70 -40, 70 -40, 60 30 C50 60, -50 60, -60 30Z" fill="#f7a8c8" stroke="#1a1a1a" stroke-width="5"/>
      <circle cx="-18" cy="2" r="6" fill="#1a1a1a"/><circle cx="18" cy="2" r="6" fill="#1a1a1a"/>
      <path d="M-12 22 q12 10 24 0" stroke="#1a1a1a" stroke-width="4" fill="none"/>
      <text y="90" font-size="16" fill="#1a1a1a">canPlayCasino</text>
      <text y="114" font-size="16" fill="#2e7d32" font-weight="700">CC 2</text>
    </g>
    <g transform="translate(1075 520)">
      <path d="M-60 30 C-70 -40, 70 -40, 60 30 C50 60, -50 60, -60 30Z" fill="#c9b8f0" stroke="#1a1a1a" stroke-width="5"/>
      <circle cx="-18" cy="2" r="6" fill="#1a1a1a"/><circle cx="18" cy="2" r="6" fill="#1a1a1a"/>
      <path d="M-12 22 q12 10 24 0" stroke="#1a1a1a" stroke-width="4" fill="none"/>
      <text y="90" font-size="16" fill="#1a1a1a">notifyQuietly</text>
      <text y="114" font-size="16" fill="#2e7d32" font-weight="700">CC 2</text>
    </g>
  </g>
  <g transform="translate(860 730)">
    <rect x="-260" y="-30" width="520" height="54" rx="27" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>
    <text y="5" text-anchor="middle" font-size="20" fill="#1a1a1a">each one fits in your head (and in a test)</text>
  </g>
</svg>
