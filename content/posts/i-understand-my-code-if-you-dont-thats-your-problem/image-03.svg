<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Chalkboard SE','Comic Sans MS','Marker Felt',sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#5d6b80"/>
  <rect y="660" width="1200" height="140" fill="#4a5a3e"/>

  <!-- storm cloud -->
  <g fill="#3a4250" stroke="#1a1a1a" stroke-width="5">
    <path d="M150 170 a80 80 0 0 1 140 -60 a110 110 0 0 1 200 -20 a100 100 0 0 1 190 10 a90 90 0 0 1 170 20 a80 80 0 0 1 160 30 a70 70 0 0 1 -10 120 h-840 a70 70 0 0 1 -10 -100z"/>
  </g>
  <text x="620" y="190" text-anchor="middle" font-size="34" font-weight="700" fill="#ffd54a">47 PATHS TO TEST</text>

  <!-- arrows raining -->
  <g stroke="#1a1a1a" stroke-width="5" marker-end="url(#tip)" stroke-linecap="round">
    <path d="M220 290 l-40 170"/>
    <path d="M320 290 l-30 260"/>
    <path d="M420 300 l-20 140"/>
    <path d="M520 300 l-10 110"/>
    <path d="M760 300 l10 110"/>
    <path d="M860 300 l20 150"/>
    <path d="M960 290 l30 240"/>
    <path d="M1040 290 l40 170"/>
    <path d="M1110 280 l40 260"/>
    <path d="M150 300 l-40 300"/>
    <path d="M600 300 l0 80"/>
    <path d="M680 300 l5 80"/>
    <path d="M370 470 l-20 150"/>
  </g>
  <g font-family="Menlo,monospace" font-size="15" fill="#fff" font-weight="700">
    <text x="130" y="470">null slip</text>
    <text x="250" y="580">casino, age 20</text>
    <text x="900" y="480">VIP + live</text>
    <text x="1000" y="560">notify fails</text>
    <text x="1060" y="490">empty slip</text>
  </g>

  <!-- Timofei with tiny umbrella -->
  <g transform="translate(640 520)">
    <path d="M-80 180 C-80 70, -50 40, 0 40 C50 40, 80 70, 80 180Z" fill="#0057b7" stroke="#1a1a1a" stroke-width="5"/>
    <circle r="62" fill="#f2c39b" stroke="#1a1a1a" stroke-width="5"/>
    <path d="M-62 -8 C-72 -72, 48 -96, 64 -16 C48 -48, 16 -40, 0 -48 C-16 -32, -48 -40, -62 -8Z" fill="#5a3a22" stroke="#1a1a1a" stroke-width="5"/>
    <rect x="-50" y="-6" width="44" height="28" rx="8" fill="#111"/>
    <rect x="6" y="-6" width="44" height="28" rx="8" fill="#111"/>
    <rect x="-8" y="0" width="16" height="5" fill="#111"/>
    <path d="M-18 40 Q6 52 28 32" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- arm up -->
    <path d="M60 80 L100 -10" stroke="#0057b7" stroke-width="26" stroke-linecap="round"/>
    <circle cx="102" cy="-14" r="15" fill="#f2c39b" stroke="#1a1a1a" stroke-width="4"/>
    <!-- cocktail umbrella -->
    <path d="M102 -14 L102 -80" stroke="#8a5a3b" stroke-width="4"/>
    <path d="M70 -80 Q102 -112 134 -80 Z" fill="#ff6fae" stroke="#1a1a1a" stroke-width="3"/>
  </g>
  <g transform="translate(830 700)">
    <rect width="230" height="70" rx="12" fill="#fff" stroke="#1a1a1a" stroke-width="4"/>
    <text x="115" y="30" text-anchor="middle" font-family="Menlo,monospace" font-size="16" fill="#1a1a1a">placeBet_works()</text>
    <text x="115" y="56" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="700">✔ 1 test, all green</text>
  </g>
</svg>
