<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1000" height="470" rx="14" fill="#f7f8fb"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#1a1f2e">Who holds the database connection?</text>
  <text x="40" y="80" font-size="15" fill="#5b6378">GET /orders/42 · same request, same SQL</text>

  <!-- request phases -->
  <text x="40" y="146" font-size="15" font-weight="600" fill="#1a1f2e">Request</text>
  <text x="250" y="114" font-size="12" fill="#2f6fdf" font-weight="600">@Transactional</text>
  <rect x="250" y="122" width="70" height="40" rx="6" fill="#dbe7ff" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="285" y="147" font-size="13" text-anchor="middle" fill="#1a1f2e">SQL</text>
  <rect x="324" y="122" width="412" height="40" rx="6" fill="#e9ebf1" stroke="#9aa2b5" stroke-width="1.5"/>
  <text x="530" y="147" font-size="14" text-anchor="middle" fill="#1a1f2e">pricing service HTTP call · ~300 ms</text>
  <rect x="740" y="122" width="88" height="40" rx="6" fill="#ffe7c2" stroke="#e0a526" stroke-width="1.5"/>
  <text x="784" y="147" font-size="13" text-anchor="middle" fill="#1a1f2e">lazy load</text>
  <rect x="832" y="122" width="88" height="40" rx="6" fill="#e9ebf1" stroke="#9aa2b5" stroke-width="1.5"/>
  <text x="876" y="147" font-size="13" text-anchor="middle" fill="#1a1f2e">JSON</text>

  <!-- OSIV on -->
  <text x="40" y="222" font-size="15" font-weight="600" fill="#1a1f2e">OSIV on</text>
  <text x="40" y="242" font-size="13" fill="#5b6378">(the default)</text>
  <rect x="250" y="206" width="670" height="30" rx="6" fill="#d1453b"/>
  <text x="585" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">connection held ≈ 320 ms</text>

  <!-- OSIV off -->
  <text x="40" y="302" font-size="15" font-weight="600" fill="#1a1f2e">OSIV off</text>
  <text x="40" y="322" font-size="13" fill="#5b6378">(explicit fetching)</text>
  <rect x="250" y="286" width="70" height="30" rx="6" fill="#2e8b57"/>
  <text x="332" y="306" font-size="14" font-weight="600" fill="#2e8b57">≈ 15 ms, back to the pool before the HTTP call</text>

  <!-- results -->
  <rect x="40" y="370" width="440" height="68" rx="10" fill="#fdecea" stroke="#d1453b" stroke-width="1.5"/>
  <text x="60" y="399" font-size="15" fill="#1a1f2e">Pool of 10, connection held 320 ms</text>
  <text x="60" y="424" font-size="17" font-weight="700" fill="#d1453b">max ≈ 31 requests/s</text>
  <rect x="520" y="370" width="440" height="68" rx="10" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="540" y="399" font-size="15" fill="#1a1f2e">Pool of 10, connection held 15 ms</text>
  <text x="540" y="424" font-size="17" font-weight="700" fill="#2e8b57">max ≈ 660 requests/s</text>
</svg>
