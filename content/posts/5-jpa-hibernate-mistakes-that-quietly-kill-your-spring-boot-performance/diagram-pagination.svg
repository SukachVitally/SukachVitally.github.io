<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1f2e"/>
    </marker>
  </defs>
  <rect width="1000" height="440" rx="14" fill="#f7f8fb"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#1a1f2e">Page 1 of 20 orders, paginated in memory</text>
  <text x="40" y="80" font-size="15" fill="#5b6378">JOIN FETCH o.items + Pageable → the SQL has no LIMIT and no OFFSET</text>

  <!-- database -->
  <path d="M60 140 a90 22 0 0 1 180 0 v140 a90 22 0 0 1 -180 0 z" fill="#dbe7ff" stroke="#2f6fdf" stroke-width="2"/>
  <ellipse cx="150" cy="140" rx="90" ry="22" fill="#eef3ff" stroke="#2f6fdf" stroke-width="2"/>
  <text x="150" y="215" font-size="15" font-weight="600" text-anchor="middle" fill="#1a1f2e">orders</text>
  <text x="150" y="237" font-size="15" font-weight="600" text-anchor="middle" fill="#1a1f2e">+ order_items</text>

  <!-- rows arrow -->
  <line x1="252" y1="215" x2="430" y2="215" stroke="#1a1f2e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="341" y="190" font-size="22" font-weight="800" text-anchor="middle" fill="#d1453b">500,000 rows</text>
  <text x="341" y="244" font-size="13" text-anchor="middle" fill="#5b6378">50,000 orders × 10 items</text>

  <!-- hibernate -->
  <rect x="440" y="140" width="250" height="150" rx="12" fill="#ffffff" stroke="#9aa2b5" stroke-width="2"/>
  <text x="565" y="176" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1f2e">Hibernate</text>
  <text x="565" y="206" font-size="14" text-anchor="middle" fill="#1a1f2e">hydrates 550,000 entities</text>
  <text x="565" y="228" font-size="14" text-anchor="middle" fill="#1a1f2e">into the persistence context,</text>
  <text x="565" y="250" font-size="14" text-anchor="middle" fill="#1a1f2e">then applies the page</text>

  <!-- page -->
  <line x1="700" y1="215" x2="788" y2="215" stroke="#1a1f2e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="798" y="150" width="160" height="130" rx="12" fill="#e6f4ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="878" y="196" font-size="15" text-anchor="middle" fill="#1a1f2e">Page 1</text>
  <text x="878" y="228" font-size="26" font-weight="800" text-anchor="middle" fill="#2e8b57">20 orders</text>
  <text x="878" y="256" font-size="13" text-anchor="middle" fill="#5b6378">what the screen needs</text>

  <!-- discarded -->
  <line x1="565" y1="300" x2="565" y2="330" stroke="#d1453b" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="565" y="352" font-size="15" font-weight="600" text-anchor="middle" fill="#d1453b">49,980 orders thrown away · page 2 costs the same</text>

  <!-- log line -->
  <rect x="40" y="378" width="920" height="40" rx="8" fill="#141a2e"/>
  <text x="60" y="403" font-family="Menlo,Consolas,monospace" font-size="13" fill="#febc2e">WARN  HHH90003004: firstResult/maxResults specified with collection fetch; applying in memory</text>
</svg>
