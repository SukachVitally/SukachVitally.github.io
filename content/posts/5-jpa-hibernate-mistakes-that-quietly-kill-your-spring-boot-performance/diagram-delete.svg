<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1000" height="440" rx="14" fill="#f7f8fb"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#1a1f2e">Deleting 10,000 orders with 10 items each</text>

  <!-- left: derived delete -->
  <rect x="40" y="76" width="560" height="340" rx="12" fill="#ffffff" stroke="#d1453b" stroke-width="1.5"/>
  <text x="64" y="110" font-family="Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1f2e">deleteByCreatedAtBefore(cutoff)</text>

  <g font-size="14" fill="#1a1f2e">
    <text x="64" y="150" font-weight="700" text-anchor="start">1</text>
    <text x="150" y="150">SELECT orders</text>
    <rect x="150" y="158" width="3" height="12" fill="#d1453b"/>

    <text x="64" y="196" font-weight="700">10,000</text>
    <text x="150" y="196">SELECT items (load collection to cascade)</text>
    <rect x="150" y="204" width="40" height="12" fill="#d1453b"/>

    <text x="64" y="242" font-weight="700">100,000</text>
    <text x="150" y="242">DELETE FROM order_items WHERE id=?</text>
    <rect x="150" y="250" width="400" height="12" fill="#d1453b"/>

    <text x="64" y="288" font-weight="700">10,000</text>
    <text x="150" y="288">DELETE FROM orders WHERE id=?</text>
    <rect x="150" y="296" width="40" height="12" fill="#d1453b"/>
  </g>
  <line x1="64" y1="330" x2="576" y2="330" stroke="#e3e6ee" stroke-width="1.5"/>
  <text x="64" y="370" font-size="30" font-weight="800" fill="#d1453b">120,001 statements</text>
  <text x="64" y="398" font-size="13" fill="#5b6378">+ 110,000 managed entities in memory, callbacks, audit rows</text>

  <!-- right: bulk delete -->
  <rect x="630" y="76" width="330" height="340" rx="12" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="654" y="110" font-family="Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1f2e">2 × @Modifying @Query</text>

  <g font-size="14" fill="#1a1f2e">
    <text x="654" y="150" font-weight="700">1</text>
    <text x="680" y="150">DELETE FROM order_items</text>
    <text x="680" y="170" fill="#5b6378">WHERE order_id IN (…)</text>
    <rect x="680" y="180" width="3" height="12" fill="#2e8b57"/>

    <text x="654" y="226" font-weight="700">1</text>
    <text x="680" y="226">DELETE FROM orders</text>
    <text x="680" y="246" fill="#5b6378">WHERE created_at &lt; ?</text>
    <rect x="680" y="256" width="3" height="12" fill="#2e8b57"/>
  </g>
  <line x1="654" y1="330" x2="936" y2="330" stroke="#e3e6ee" stroke-width="1.5"/>
  <text x="654" y="370" font-size="30" font-weight="800" fill="#2e8b57">2 statements</text>
  <text x="654" y="398" font-size="13" fill="#5b6378">no cascades, no callbacks, no audit</text>
</svg>
